<div class="layout">

  <!-- LEFT SIDE -->
  <div class="left-column">

    <!-- MAIN LIST -->
    <section id="levels">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MAIN LIST</p>
          <h2>Extreme Demons</h2>
        </div>
        <input id="mainSearch" placeholder="Search levels...">
      </div>

      <div id="mainLevelList" class="level-grid"></div>
    </section>

    <hr class="divider">

    <!-- EXTENDED LIST -->
    <section id="extended">
      <div class="section-heading">
        <div>
          <p class="eyebrow">EXTENDED LIST</p>
          <h2>Insane Demons & Below</h2>
        </div>
      </div>

      <div id="extendedLevelList" class="level-grid"></div>
    </section>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right-column">
    <section id="players">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PLAYER PROFILES</p>
          <h2>Players</h2>
        </div>
      </div>

      <div id="playerList" class="player-grid"></div>
    </section>
  </div>

</div>
